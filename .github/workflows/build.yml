name: Build Release Artifacts

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PYTHONUNBUFFERED: 1
  PYTHONUTF8: 1

jobs:
  # ─── Run tests first ───────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  # ─── macOS (arm64) ────────────────────────────────────────────────────────
  build-macos-arm64:
    needs: test
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Bundle ffmpeg
        run: python build/bundle_ffmpeg.py --from-system

      - name: Install dependencies
        run: pip install -e ".[dev,gui-test]"

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onedir --windowed
          --name "CDJAudioToolkit"
          --add-data "ffmpeg/darwin:ffmpeg/darwin"
          --hidden-import src
          --hidden-import src.cli
          --hidden-import src.config
          --hidden-import src.compatibility
          --hidden-import src.backup
          --hidden-import src.converter
          --hidden-import src.metadata
          --hidden-import src.utils
          --hidden-import gui
          --hidden-import gui.theme
          --hidden-import gui.app
          --hidden-import gui.tabs.check_tab
          --hidden-import gui.tabs.backup_tab
          --hidden-import gui.tabs.convert_tab
          --noconfirm
          gui/app.py

      - name: Create DMG installer
        run: |
          # Standard macOS: .dmg with .app + Applications symlink
          mkdir -p dmg_root
          cp -R dist/CDJAudioToolkit.app dmg_root/
          ln -sf /Applications dmg_root/Applications
          hdiutil create -volname "CDJAudioToolkit" \
            -srcfolder dmg_root \
            -ov -format UDZO \
            dist/CDJAudioToolkit-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDJAudioToolkit-macos-arm64
          path: dist/CDJAudioToolkit-macos-arm64.dmg

  # ─── macOS (x86_64 / Intel) ────────────────────────────────────────────────
  build-macos-x86_64:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Bundle ffmpeg
        run: python build/bundle_ffmpeg.py --from-system

      - name: Install dependencies
        run: pip install -e ".[dev,gui-test]"

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onedir --windowed
          --name "CDJAudioToolkit"
          --add-data "ffmpeg/darwin:ffmpeg/darwin"
          --hidden-import src
          --hidden-import src.cli
          --hidden-import src.config
          --hidden-import src.compatibility
          --hidden-import src.backup
          --hidden-import src.converter
          --hidden-import src.metadata
          --hidden-import src.utils
          --hidden-import gui
          --hidden-import gui.theme
          --hidden-import gui.app
          --hidden-import gui.tabs.check_tab
          --hidden-import gui.tabs.backup_tab
          --hidden-import gui.tabs.convert_tab
          --noconfirm
          gui/app.py

      - name: Create DMG installer
        run: |
          mkdir -p dmg_root
          cp -R dist/CDJAudioToolkit.app dmg_root/
          ln -sf /Applications dmg_root/Applications
          hdiutil create -volname "CDJAudioToolkit" \
            -srcfolder dmg_root \
            -ov -format UDZO \
            dist/CDJAudioToolkit-macos-x86_64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDJAudioToolkit-macos-x86_64
          path: dist/CDJAudioToolkit-macos-x86_64.dmg

  # ─── Windows (x86_64) — NSIS Installer ────────────────────────────────────
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: |
          choco install ffmpeg --yes
          Write-Output "FFmpeg installed"

      - name: Bundle ffmpeg
        run: python build/bundle_ffmpeg.py --from-system

      - name: Install dependencies
        run: pip install -e ".[dev,gui-test]"

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onedir --windowed
          --name "CDJAudioToolkit"
          --add-data "ffmpeg\win32;ffmpeg\win32"
          --hidden-import src
          --hidden-import src.cli
          --hidden-import src.config
          --hidden-import src.compatibility
          --hidden-import src.backup
          --hidden-import src.converter
          --hidden-import src.metadata
          --hidden-import src.utils
          --hidden-import gui
          --hidden-import gui.theme
          --hidden-import gui.app
          --hidden-import gui.tabs.check_tab
          --hidden-import gui.tabs.backup_tab
          --hidden-import gui.tabs.convert_tab
          --noconfirm
          gui\app.py

      - name: Create NSIS installer
        run: |
          # Install NSIS
          choco install nsis --yes
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"

          # Write NSIS script
          @"
          !include "MUI2.nsh"
          !define APP_NAME "CDJAudioToolkit"
          !define APP_VERSION "0.1.0"
          !define APP_PUBLISHER "CDJ Audio Toolkit Contributors"
          !define APP_EXE "CDJAudioToolkit.exe"
          !define INSTALL_DIR "`$PROGRAM64\`${APP_NAME}"

          Name "${APP_NAME}"
          OutFile "CDJAudioToolkit-windows-x86_64.exe"
          InstallDir "${INSTALL_DIR}"
          RequestExecutionLevel admin

          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
            SetOutPath "${INSTALL_DIR}"
            File /r "dist\${APP_NAME}\*.*"
            CreateShortCut "`$DESKTOP\${APP_NAME}.lnk" "${INSTALL_DIR}\${APP_EXE}"
            CreateDirectory "`$SMPROGRAMS\${APP_NAME}"
            CreateShortCut "`$SMPROGRAMS\${APP_NAME}\${APP_NAME}.lnk" "${INSTALL_DIR}\${APP_EXE}"
            CreateShortCut "`$SMPROGRAMS\${APP_NAME}\Uninstall.lnk" "${INSTALL_DIR}\uninstall.exe"
            WriteUninstaller "${INSTALL_DIR}\uninstall.exe"
          SectionEnd

          Section "Uninstall"
            RMDir /r "${INSTALL_DIR}"
            Delete "`$DESKTOP\${APP_NAME}.lnk"
            RMDir /r "`$SMPROGRAMS\${APP_NAME}"
          SectionEnd
          "@ | Out-File -FilePath installer.nsi -Encoding UTF8

          # Build installer
          makensis installer.nsi

          # Move to dist
          Move-Item "CDJAudioToolkit-windows-x86_64.exe" "dist\"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDJAudioToolkit-windows-x86_64
          path: dist/CDJAudioToolkit-windows-x86_64.exe

  # ─── Linux (x86_64) — .deb package ────────────────────────────────────────
  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg dpkg-dev

      - name: Bundle ffmpeg
        run: python build/bundle_ffmpeg.py --from-system

      - name: Install dependencies
        run: pip install -e ".[dev,gui-test]"

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onedir
          --name "cdj-audio-toolkit"
          --add-data "ffmpeg/linux:ffmpeg/linux"
          --hidden-import src
          --hidden-import src.cli
          --hidden-import src.config
          --hidden-import src.compatibility
          --hidden-import src.backup
          --hidden-import src.converter
          --hidden-import src.metadata
          --hidden-import src.utils
          --hidden-import gui
          --hidden-import gui.theme
          --hidden-import gui.app
          --hidden-import gui.tabs.check_tab
          --hidden-import gui.tabs.backup_tab
          --hidden-import gui.tabs.convert_tab
          --noconfirm
          gui/app.py

      - name: Create .deb package
        run: |
          APP_NAME="cdj-audio-toolkit"
          APP_VERSION="0.1.0"
          ARCH="amd64"
          PKG_NAME="${APP_NAME}_${APP_VERSION}_${ARCH}.deb"

          # Create .deb directory structure
          DEB_DIR="deb_root"
          INSTALL_DIR="${DEB_DIR}/opt/CDJAudioToolkit"
          mkdir -p "${INSTALL_DIR}"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/DEBIAN"

          # Copy built application
          cp -r dist/cdj-audio-toolkit/* "${INSTALL_DIR}/"

          # Create launcher script
          cat > "${DEB_DIR}/usr/bin/cdj-audio-toolkit" << 'LAUNCHER'
          #!/bin/sh
          exec /opt/CDJAudioToolkit/cdj-audio-toolkit "$@"
          LAUNCHER
          chmod 755 "${DEB_DIR}/usr/bin/cdj-audio-toolkit"

          # Create .desktop file
          cat > "${DEB_DIR}/usr/share/applications/cdj-audio-toolkit.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=CDJ Audio Toolkit
          Comment=Check compatibility, backup playlists, convert audio for Pioneer CDJ
          Exec=/opt/CDJAudioToolkit/cdj-audio-toolkit
          Icon=cdj-audio-toolkit
          Terminal=false
          Type=Application
          Categories=Audio;Music;AudioVideo;
          DESKTOP

          # Create control file
          cat > "${DEB_DIR}/DEBIAN/control" << CONTROL
          Package: ${APP_NAME}
          Version: ${APP_VERSION}
          Section: sound
          Priority: optional
          Architecture: ${ARCH}
          Depends: libgl1, libxkbcommon0
          Maintainer: CDJ Audio Toolkit Contributors
          Description: CDJ Audio Toolkit for Pioneer CDJ players
           Check audio file compatibility with CDJ models, backup playlist
           tracks, and convert audio to optimal CDJ formats.
          CONTROL

          # Build .deb
          dpkg-deb --build "${DEB_DIR}" "dist/${PKG_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDJAudioToolkit-linux-x86_64
          path: dist/cdj-audio-toolkit_0.1.0_amd64.deb

  # ─── Create GitHub Release (on tag) ────────────────────────────────────────
  release:
    needs: [build-macos-arm64, build-macos-x86_64, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.deb
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
