name: Build Release Artifacts

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PYTHONUNBUFFERED: 1
  PYTHONUTF8: 1

jobs:
  # ─── Run tests first ───────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  # ─── macOS (arm64) ────────────────────────────────────────────────────────
  build-macos-arm64:
    needs: test
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Bundle ffmpeg
        run: python build/bundle_ffmpeg.py --from-system

      - name: Install dependencies
        run: pip install -e ".[dev,gui-test]"

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onedir --windowed
          --name "CDJAudioToolkit"
          --add-data "ffmpeg/darwin:ffmpeg/darwin"
          --hidden-import src
          --hidden-import src.cli
          --hidden-import src.config
          --hidden-import src.compatibility
          --hidden-import src.backup
          --hidden-import src.converter
          --hidden-import src.metadata
          --hidden-import src.utils
          --hidden-import gui
          --hidden-import gui.theme
          --hidden-import gui.app
          --hidden-import gui.tabs.check_tab
          --hidden-import gui.tabs.backup_tab
          --hidden-import gui.tabs.convert_tab
          --noconfirm
          gui/app.py

      - name: Create DMG
        run: |
          ln -sf /Applications dist/CDJAudioToolkit.app/
          hdiutil create -volname "CDJAudioToolkit" \
            -srcfolder dist/CDJAudioToolkit.app \
            -ov -format UDZO \
            dist/CDJAudioToolkit-macos-arm64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDJAudioToolkit-macos-arm64
          path: dist/CDJAudioToolkit-macos-arm64.dmg

  # ─── macOS (x86_64 / Intel) ────────────────────────────────────────────────
  build-macos-x86_64:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Bundle ffmpeg
        run: python build/bundle_ffmpeg.py --from-system

      - name: Install dependencies
        run: pip install -e ".[dev,gui-test]"

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onedir --windowed
          --name "CDJAudioToolkit"
          --add-data "ffmpeg/darwin:ffmpeg/darwin"
          --hidden-import src
          --hidden-import src.cli
          --hidden-import src.config
          --hidden-import src.compatibility
          --hidden-import src.backup
          --hidden-import src.converter
          --hidden-import src.metadata
          --hidden-import src.utils
          --hidden-import gui
          --hidden-import gui.theme
          --hidden-import gui.app
          --hidden-import gui.tabs.check_tab
          --hidden-import gui.tabs.backup_tab
          --hidden-import gui.tabs.convert_tab
          --noconfirm
          gui/app.py

      - name: Create DMG
        run: |
          ln -sf /Applications dist/CDJAudioToolkit.app/
          hdiutil create -volname "CDJAudioToolkit" \
            -srcfolder dist/CDJAudioToolkit.app \
            -ov -format UDZO \
            dist/CDJAudioToolkit-macos-x86_64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDJAudioToolkit-macos-x86_64
          path: dist/CDJAudioToolkit-macos-x86_64.dmg

  # ─── Windows (x86_64) ─────────────────────────────────────────────────────
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: |
          choco install ffmpeg --yes
          Write-Output "FFmpeg installed"

      - name: Bundle ffmpeg
        run: python build/bundle_ffmpeg.py --from-system

      - name: Install dependencies
        run: pip install -e ".[dev,gui-test]"

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onedir --windowed
          --name "CDJAudioToolkit"
          --add-data "ffmpeg\win32;ffmpeg\win32"
          --hidden-import src
          --hidden-import src.cli
          --hidden-import src.config
          --hidden-import src.compatibility
          --hidden-import src.backup
          --hidden-import src.converter
          --hidden-import src.metadata
          --hidden-import src.utils
          --hidden-import gui
          --hidden-import gui.theme
          --hidden-import gui.app
          --hidden-import gui.tabs.check_tab
          --hidden-import gui.tabs.backup_tab
          --hidden-import gui.tabs.convert_tab
          --noconfirm
          gui\app.py

      - name: Create ZIP archive
        run: >
          Compress-Archive
          -Path dist\CDJAudioToolkit\*
          -DestinationPath dist\CDJAudioToolkit-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDJAudioToolkit-windows-x86_64
          path: dist/CDJAudioToolkit-windows-x86_64.zip

  # ─── Linux (x86_64) ───────────────────────────────────────────────────────
  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bundle ffmpeg
        run: python build/bundle_ffmpeg.py --from-system

      - name: Install dependencies
        run: pip install -e ".[dev,gui-test]"

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onedir
          --name "cdj-audio-toolkit"
          --add-data "ffmpeg/linux:ffmpeg/linux"
          --hidden-import src
          --hidden-import src.cli
          --hidden-import src.config
          --hidden-import src.compatibility
          --hidden-import src.backup
          --hidden-import src.converter
          --hidden-import src.metadata
          --hidden-import src.utils
          --hidden-import gui
          --hidden-import gui.theme
          --hidden-import gui.app
          --hidden-import gui.tabs.check_tab
          --hidden-import gui.tabs.backup_tab
          --hidden-import gui.tabs.convert_tab
          --noconfirm
          gui/app.py

      - name: Create tar.gz archive
        run: tar czf dist/cdj-audio-toolkit-linux-x86_64.tar.gz -C dist cdj-audio-toolkit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDJAudioToolkit-linux-x86_64
          path: dist/cdj-audio-toolkit-linux-x86_64.tar.gz

  # ─── Create GitHub Release (on tag) ────────────────────────────────────────
  release:
    needs: [build-macos-arm64, build-macos-x86_64, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
