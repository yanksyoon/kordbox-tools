[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdj-audio-toolkit"
version = "0.1.0"
description = "CDJ Audio Toolkit - Check compatibility, backup playlists, and convert audio for Pioneer CDJ players"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-qt>=4.0",
    "pyinstaller>=6.0",
]

[project.scripts]
cdj-tool = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:operator"
